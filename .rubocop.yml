AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "tmp/**/*"
    - "demo/**/*"
    - "vendor/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: double_quotes

Style/Documentation:
  Enabled: false

Metrics/MethodLength:
  Max: 25

Metrics/AbcSize:
  Max: 25

Metrics/CyclomaticComplexity:
  Max: 12

Metrics/PerceivedComplexity:
  Max: 12

Metrics/ClassLength:
  Max: 250

Metrics/ModuleLength:
  Max: 220

Metrics/BlockLength:
  Exclude:
    - "spec/**/*"
    - "*.gemspec"

# Specs describe behaviour with data tables; that is what they are for.
Lint/ConstantDefinitionInBlock:
  Exclude:
    - "spec/**/*"

# The read-only allowlist is data, but it belongs next to the code that enforces it.
Metrics/CollectionLiteralLength:
  Enabled: false

Layout/LineLength:
  Max: 120

# Keyword arguments on a value object read as named fields, not as a long
# positional parameter list.
Metrics/ParameterLists:
  CountKeywordArgs: false

Naming/MethodParameterName:
  AllowedNames:
    - ui
    - io
    - id
    - to
    - on
    - at
    - by

Naming/PredicateMethod:
  AllowedMethods:
    - run

# Ruby 3.2+ autoloads the Set constant, but Enumerable#to_set only exists once
# the library has actually been required.
Lint/RedundantRequireStatement:
  Enabled: false

Style/ReturnNil:
  Enabled: true
  EnforcedStyle: return
